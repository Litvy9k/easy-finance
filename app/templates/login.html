<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>登录 · 简账</title><link rel="stylesheet" href="{{ base_path }}/static/app.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="brand-mark">简</div><h1>欢迎回来</h1><p class="muted">输入密码继续使用简账</p>
    <form method="post" class="stack"><input type="hidden" name="next" value="{{ request.query_params.get('next', base_path + '/') }}">
      <label>密码<input name="password" type="password" required autofocus autocomplete="current-password" placeholder="请输入密码"></label>
      {% if error %}<p class="error">{{ error }}</p>{% endif %}<button class="primary" type="submit">登录</button>
    </form>
  </main>
</body></html>
