# Include INSIDE the existing HTTPS server {} for l9k.dev.
# Keep the personal site's existing location / and TLS configuration unchanged.
location = /ef {
    return 308 /ef/$is_args$args;
}

# The shared zone is defined at http scope in nginx-finance-limits.conf.
location = /ef/login {
    limit_req zone=ef_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8001/login;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location ^~ /ef/ {
    # The trailing slash strips /ef/ before forwarding to FastAPI.
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 10m;
    # Never inherit the personal site's proxy cache for financial data.
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
