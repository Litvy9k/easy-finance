# Include at http scope (Debian Nginx normally loads /etc/nginx/conf.d/*.conf).
# Empty keys are not counted: only POST requests to the login endpoint consume quota.
map "$request_method:$uri" $ef_login_key {
    default "";
    "POST:/ef/login" $binary_remote_addr;
}
limit_req_zone $ef_login_key zone=ef_login:1m rate=5r/m;
